<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بنك الكريمي -  </title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#713fc0,#32105f);
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.container {
  width: 100%;
  max-width: 390px;
  background: #fff;
  color: #32105f;
  padding: 28px 22px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 10px 35px #18052e66;
}
.logo {
  font-size: 45px;
}
h2 {
  font-size: 21px;
  margin-bottom: 8px;
}
.subtitle {
  color: #777;
  font-size: 13px;
  margin-bottom: 22px;
}
input {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
  text-align: center;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: #713fc0;
  color: white;
  font-size: 17px;
  cursor: pointer;
}
button:disabled {
  opacity: .6;
}
#result {
  display: none;
  margin-top: 18px;
  padding: 15px;
  border-radius: 10px;
  background: #eee5fa;
  color: #51218c;
  font-weight: bold;
}
.note {
  color: #888;
  font-size: 11px;
  margin-top: 18px;
}
</style>
</head>

<body>

<div class="container">
  <div class="logo">🏦</div>

  <h2>بنك الكريمي للتمويل الأصغر الإسلامي</h2>
  <div class="subtitle">   بنك الكريمي دومن معك</div>

  <input type="text"
         value="DEMO-2026"
         readonly
         aria-label="الرقم ">

  <input type="text"
         value="TEST-1234"
         readonly
         aria-label="كلمة المرور ">

  <button id="notifyBtn" onclick="sendNotice()">
    🔔 إرسال إشعار 
  </button>

  <div id="result" role="status"></div>

  <div class="note">
    هذا نموذج   تابع للبنك  وينفذ أي عمليات مصرفية.
  </div>
</div>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
(function () {
  emailjs.init({
    publicKey: "YOUR_PUBLIC_KEY"
  });
})();

async function sendNotice() {
  const btn = document.getElementById("notifyBtn");
  const result = document.getElementById("result");

  btn.disabled = true;
  btn.textContent = "جارٍ إرسال الإشعار...";

  try {
    await emailjs.send(
      "YOUR_SERVICE_ID",
      "YOUR_TEMPLATE_ID",
      {
        subject: "نجاح المهمة ",
        message: "تم تنفيذ المهمة  بنجاح."
      }
    );

    result.style.display = "block";
    result.textContent = "✓ لقد نجحت المهمة! تم إرسال إشعار البريد الإلكتروني.";
  } catch (error) {
    result.style.display = "block";
    result.textContent = "تعذر إرسال البريد. تحقق من إعدادات EmailJS.";
  }

  btn.disabled = false;
  btn.textContent = "🔔 إرسال إشعار ";
}
</script>

</body>
</html>
