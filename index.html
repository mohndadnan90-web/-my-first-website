
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مشاركة تجريبية</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #713fc0;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
}

header {
  background: white;
  color: #39265c;
  padding: 17px;
  font-size: 19px;
  font-weight: bold;
}

.container {
  max-width: 340px;
  margin: 55px auto;
  padding: 15px;
}

.card {
  background: white;
  color: #39265c;
  padding: 20px;
  border-radius: 14px;
}

.qr {
  width: 95px;
  height: 95px;
  border: 2px dashed #713fc0;
  border-radius: 8px;
  margin: 12px auto;
  display: grid;
  place-items: center;
  font-size: 15px;
  color: #713fc0;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 11px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 7px;
  text-align: center;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 11px;
  background: #713fc0;
  color: white;
  border: none;
  border-radius: 7px;
  font-size: 16px;
  cursor: pointer;
}

#success {
  display: none;
  position: fixed;
  inset: 0;
  background: #0008;
  justify-content: center;
  align-items: center;
}

.message {
  background: #713fc0;
  color: white;
  width: 85%;
  max-width: 300px;
  padding: 30px 15px;
  border-radius: 15px;
  box-shadow: 0 5px 25px #0004;
}

.emoji {
  font-size: 38px;
}
small {
  color: #777;
  font-size: 11px;
}
</style>
</head>

<body>

<header>
  بنك الكريمي للتمويل الاصغر الاسلامي التجريبي
</header>

<div class="container">
  <div class="card">

    <h3>مشاركة تجريبية</h3>

    <div class="qr">QR DEMO</div>

    <p>أدخل رمزاً حسابك</p>

    <input
      id="code"
      type="text"
      maxlength="6"
      placeholder="رمز حساب ">

    <input
      id="name"
      type="text"
      placeholder="أدخل اسمك الرباعي">

    <button onclick="sendDemo()">
      إرسال
    </button>

    <p id="error" style="color:red;font-size:12px"></p>

    <small>محاكاة مستقلة  تجمع بيانات مصرفيةلبنك الكريمي.</small>

  </div>
</div>

<div id="success">
  <div class="message">
    <div class="emoji">🎉💜</div>
    <h3>شكراً لك!</h3>
    <p>لقد تمت المشاركة بنجاح</p>
    <button onclick="closeMessage()">حسناً</button>
  </div>
</div>

<script>
function sendDemo() {
  const code = document.getElementById("code").value;
  const name = document.getElementById("name").value.trim();
  const error = document.getElementById("error");

  if (!/^[0-9]{4,6}$/.test(code)) {
    error.textContent = "أدخل رمزاً  صحيحاً";
    return;
  }

  if (name.split(/\s+/).length < 4) {
    error.textContent = "أدخل اسماً رباعياً ";
    return;
  }

  error.textContent = "";
  document.getElementById("code").value = "";
  document.getElementById("name").value = "";

  document.getElementById("success").style.display = "flex";
}

function closeMessage() {
  document.getElementById("success").style.display = "none";
}
</script>
