<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقع مهند الرسمي</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080d18;
  color: white;
  text-align: center;
}

header {
  padding: 25px;
  background: #111a2c;
  border-bottom: 2px solid #d4af37;
}

.logo {
  color: #d4af37;
  font-size: 32px;
  font-weight: bold;
}

.hero {
  padding: 85px 20px;
}

h1 {
  color: #d4af37;
  font-size: 35px;
}

p {
  color: #d5d5d5;
  font-size: 18px;
  line-height: 2;
}

button {
  background: #d4af37;
  color: #080d18;
  border: none;
  padding: 15px 35px;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}

footer {
  background: #111a2c;
  padding: 22px;
  color: #aaa;
}
</style>
</head>

<body>

<header>
  <div class="logo">MOHANNAD</div>
  <p>الموقع الرسمي</p>
</header>

<section class="hero">
  <h1>مرحباً بكم في عالمي</h1>

  <p>
    أهلاً وسهلاً بكم في موقعي الإلكتروني.
    <br>
    هنا تبدأ رحلتي في عالم الإبداع والتصميم والتقنية.
  </p>

  <button onclick="alert('أهلاً وسهلاً بكم!')">
    اكتشف المزيد
  </button>
</section>

<footer>
  جميع الحقوق محفوظة © 2026
  <br>
  MOHANNAD
</footer>

</body>
</html>
