<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نموذج بنك تجريبي</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #713fc0;
  color: white;
  text-align: center;
}
header {
  background: white;
  color: #39265c;
  padding: 25px 10px;
  font-size: 21px;
  font-weight: bold;
}
.container {
  max-width: 400px;
  margin: 65px auto;
  padding: 25px;
}
.card {
  background: white;
  color: #39265c;
  border-radius: 15px;
  padding: 25px;
}
.qr {
  width: 150px;
  height: 150px;
  margin: 20px auto;
  border: 3px dashed #713fc0;
  display: grid;
  place-items: center;
  font-size: 18px;
}
input {
  width: 100%;
  padding: 14px;
  margin: 15px 0;
  border: 1px solid #aaa;
  border-radius: 8px;
  text-align: center;
}
button {
  width: 100%;
  padding: 14px;
  background: #713fc0;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 18px;
}
#result { margin-top: 15px; }
small { color: #ddd; }
</style>
</head>
<body>

<header>
  نموذج بنك الكريمي التجريبي
</header>

<div class="container">
  <div class="card">
    <h2>رمز QR تجريبي</h2>
    <div class="qr">QR DEMO</div>

    <p>أدخل رمزاً تجريبياً فقط</p>
    <input type="text" id="pin"
      placeholder="رمز تجريبي"
      maxlength="6">

    <button onclick="verify()">تأكيد</button>
    <p id="result"></p>
  </div>
  <p><small>هذا نموذج توضيحي غير تابع للبنك
  ولا يطلب بيانات مصرفية حقيقية.</small></p>
</div>

<script>
function verify() {
  const pin = document.getElementById("pin").value;
  const result = document.getElementById("result");

  if (!/^[0-9]{4,6}$/.test(pin)) {
    result.textContent = "أدخل رمزاً تجريبياً من 4 إلى 6 أرقام";
    return;
  }

  result.textContent = "تم التحقق التجريبي بنجاح";
  document.getElementById("pin").value = "";
}
</script>

</body>
</html>
