<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مشاركة </title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #713fc0;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
}

header {
  background: white;
  color: #39265c;
  padding: 20px;
  font-size: 19px;
  font-weight: bold;
}

.container {
  max-width: 340px;
  margin: 55px auto;
  padding: 15px;
}

.card {
  background: white;
  color: #39265c;
  padding: 22px;
  border-radius: 14px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 9px 0;
  border: 1px solid #ccc;
  border-radius: 7px;
  text-align: center;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 12px;
  background: #713fc0;
  color: white;
  border: none;
  border-radius: 7px;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

#status {
  font-size: 13px;
  margin-top: 12px;
}

.note {
  color: #777;
  font-size: 11px;
  margin-top: 18px;
}
</style>
</head>

<body>

<header>
محاكاة مشاركة  
</header>

<div class="container">
<div class="card">

<h3>مشاركة </h3>

<p>أدخل اسمك  </p>

<input
id="name"
type="text"
placeholder="الاسم "
>

<button id="sendBtn" onclick="sendDemo()">
إرسال
</button>

<p id="status"></p>

<p class="note">.
 ادخل بيانات مصرفية حقيقية.
</p>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>

// ضع Public Key الخاص بك هنا
const PUBLIC_KEY = "YOUR_PUBLIC_KEY";

// ضع Service ID الخاص بك هنا
const SERVICE_ID = "YOUR_SERVICE_ID";

// ضع Template ID الخاص بك هنا
const TEMPLATE_ID = "YOUR_TEMPLATE_ID";

emailjs.init({
  publicKey: PUBLIC_KEY
});

async function sendDemo() {

  const name = document.getElementById("name").value.trim();
  const status = document.getElementById("status");
  const btn = document.getElementById("sendBtn");

  if (!name) {
    status.textContent = "اكتب اسمك  ";
    status.style.color = "red";
    return;
  }

  btn.disabled = true;
  status.textContent = "جارٍ إرسال رسالة ...";

  try {

    await emailjs.send(
      SERVICE_ID,
      TEMPLATE_ID,
      {
        name: name,
        title: "اختبار الموقع",
        message: "تم إرسال رسالة اختبار من الموقع  بنجاح."
      }
    );

    status.textContent = "شكراً لك! تمت المشاركة بنجاح";
    status.style.color = "green";
    document.getElementById("name").value = "";

  } catch (error) {

    status.textContent = "فشل الإرسال. تحقق من إعدادات EmailJS.";
    status.style.color = "red";
    console.error(error);

  } finally {
    btn.disabled = false;
  }
}

</script>

</body>
</html>
